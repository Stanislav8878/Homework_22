{% extends "base.html" %}
{% block title %}{{ view.object|default_if_none:"Новая статья" }}{% endblock %}
{% block content %}
  <h1>{{ view.object|yesno:"Редактировать статью,Новая статья" }}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
  </form>
{% endblock %}
